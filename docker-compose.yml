services:
  api:
    build:
      context: .
      target: dev
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: development
      PORT: 5000
      CORS_ORIGIN: '*'
      MONGO_URI: mongodb://mongo:27017/livehub
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev_only_secret_change_me_in_production}
      JWT_EXPIRES_IN: 7d
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-dev_only_livekit_secret_change_me}
      LIVEKIT_SERVER_URL: ${LIVEKIT_SERVER_URL:-ws://localhost:7880}
      LOG_LEVEL: info
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  mongo:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
  redis-data:
